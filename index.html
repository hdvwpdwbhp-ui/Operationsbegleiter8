Nicht gesetzt'}</p></div></div><button class="btn btn-secondary btn-sm" onclick="surgeonModal()">Ändern</button></div></div><h3 style="font-size:.8rem;color:var(--muted);text-transform:uppercase;margin:16px 0 10px;">${t('darkMode')}</h3><div class="settings-card"><div class="settings-item"><div class="settings-label"><div class="settings-icon">${state.theme==='dark'?'🌙':'☀️'}</div><div class="settings-text"><h4>${t('darkMode')}</h4><p>Weniger Augenbelastung</p></div></div><label class="toggle"><input type="checkbox" ${state.theme==='dark'?'checked':''} onchange="toggleTheme()"><span class="toggle-slider"></span></label></div><div class="settings-item"><div class="settings-label"><div class="settings-icon">🔤</div><div class="settings-text"><h4>${t('largeFont')}</h4><p>Bessere Lesbarkeit</p></div></div><label class="toggle"><input type="checkbox" ${state.largeFont?'checked':''} onchange="toggleLargeFont()"><span class="toggle-slider"></span></label></div></div><h3 style="font-size:.8rem;color:var(--muted);text-transform:uppercase;margin:16px 0 10px;">${t('notifications')}</h3><div class="settings-card"><div class="settings-item"><div class="settings-label"><div class="settings-icon">🔔</div><div class="settings-text"><h4>${t('notifications')}</h4><p>Für Aufgaben & Medikamente</p></div></div><label class="toggle"><input type="checkbox" ${state.notifications!==false?'checked':''} onchange="toggleNotifications()"><span class="toggle-slider"></span></label></div></div><h3 style="font-size:.8rem;color:var(--muted);text-transform:uppercase;margin:16px 0 10px;">${t('data')}</h3><div class="settings-card"><div class="settings-item" style="flex-direction:column;align-items:stretch;gap:10px;"><p style="font-size:.85rem;color:var(--muted);">📷 ${state.photos.length} Fotos • 🎤 ${state.voiceMemos.length} Memos • 📄 ${state.uploadedDocs.length} Dokumente</p><button class="btn btn-secondary btn-block" onclick="exportAllData()">📤 Daten exportieren</button><button class="btn btn-danger btn-block" onclick="resetModal()">🗑️ Alle Daten löschen</button></div></div><h3 style="font-size:.8rem;color:var(--muted);text-transform:uppercase;margin:16px 0 10px;">${t('legal')}</h3><div class="settings-card"><div class="settings-item" onclick="nav('impressum')" style="cursor:pointer;"><div class="settings-label"><div class="settings-icon">ℹ️</div><div class="settings-text"><h4>${t('impressum')}</h4><p>Rechtliche Informationen</p></div></div><span style="color:var(--muted);">›</span></div></div><div class="storage-info" style="margin-top:16px;"><span>🔒</span><p>Alle Daten bleiben lokal auf diesem Gerät gespeichert und werden nicht an Server übertragen.</p></div></div>`;}
function languageModal(){showModal('🌐 '+t('selectLanguage'),`<div class="language-grid" style="max-height:400px;">${Object.entries(LANGUAGES).map(([code,lang])=>`<div class="language-option ${state.language===code?'active':''}" onclick="setLanguage('${code}');closeModal();"><span class="lang-flag">${lang.flag}</span><span class="lang-name">${lang.name}</span></div>`).join('')}</div>`);}
function opModeModal(){showModal(t('opMode'),`<p style="color:var(--muted);margin-bottom:12px;line-height:1.4;"><strong>${t('ambulant')}:</strong> ${t('ambulantExplain')}<br><strong>${t('stationary')}:</strong> ${t('stationaryExplain')}</p><div class="op-mode-toggle" style="flex-direction:column;gap:8px;"><button class="op-mode-btn ${state.profile.opMode==='ambulant'?'active':''}" onclick="setOpMode('ambulant');closeModal();">${t('ambulant')}</button><button class="op-mode-btn ${state.profile.opMode==='stationary'?'active':''}" onclick="setOpMode('stationary');closeModal();">${t('stationary')}</button><button class="op-mode-btn ${state.profile.opMode==='unknown'?'active':''}" onclick="setOpMode('unknown');closeModal();">${t('iDontKnow')}</button></div>`);}
function departureModal(){showModal('⏰ '+t('departureTime'),`<div class="form-group"><label class="form-label">${t('departureTime')}</label><input type="time" class="form-input" id="newDeparture" value="${state.profile.departureTime||''}"></div><button class="btn btn-primary btn-block" onclick="saveDeparture()">💾 Speichern</button>`);}
function saveDeparture(){const val=document.getElementById('newDeparture')?.value;setState({profile:{...state.profile,departureTime:val}});closeModal();showToast('Gespeichert ✓');}
function durationModal(){showModal('⏱️ '+t('travelDuration'),`<div class="form-group"><label class="form-label">${t('travelDuration')}</label><input type="number" class="form-input" id="newDuration" value="${state.profile.travelDuration||''}" min="1" max="300"></div><button class="btn btn-primary btn-block" onclick="saveDuration()">💾 Speichern</button>`);}
function saveDuration(){const val=document.getElementById('newDuration')?.value;setState({profile:{...state.profile,travelDuration:val}});closeModal();showToast('Gespeichert ✓');}
function transportAltModal(){showModal('🚕 '+t('transportAlt'),`<div class="form-group"><label class="form-label">${t('transportAlt')}</label><input type="text" class="form-input" id="newTransportAlt" value="${state.profile.transportAlt||''}" placeholder="${t('transportAltPlaceholder')}"></div><button class="btn btn-primary btn-block" onclick="saveTransportAlt()">💾 Speichern</button>`);}
function saveTransportAlt(){const val=document.getElementById('newTransportAlt')?.value;setState({profile:{...state.profile,transportAlt:val}});closeModal();showToast('Gespeichert ✓');}
function clinicNameModal(){showModal('🏥 Klinikname',`<div class="form-group"><label class="form-label">Name der Klinik</label><input type="text" class="form-input" id="clinicNameInput" value="${state.profile.hospitalName||''}" placeholder="z.B. Charité Berlin"></div><button class="btn btn-primary btn-block" onclick="saveClinicName()">💾 Speichern</button>`);}
function saveClinicName(){const name=document.getElementById('clinicNameInput')?.value;setState({profile:{...state.profile,hospitalName:name}});closeModal();showToast('Klinikname gespeichert ✓');}
function clinicPhoneModal(){showModal('📞 Klinik-Telefon',`<div class="form-group"><label class="form-label">Telefonnummer</label><input type="tel" class="form-input" id="clinicPhoneInput" value="${state.profile.hospitalPhone||''}" placeholder="z.B. 030 123456"></div><button class="btn btn-primary btn-block" onclick="saveClinicPhone()">💾 Speichern</button>`);}
function saveClinicPhone(){const phone=document.getElementById('clinicPhoneInput')?.value;setState({profile:{...state.profile,hospitalPhone:phone}});closeModal();showToast('Telefon gespeichert ✓');}
function emergencyContactModal(){showModal('👤 Notfallkontakt',`<div class="form-group"><label class="form-label">Name und Telefon</label><input type="text" class="form-input" id="emergencyContactInput" value="${state.profile.emergencyContact||''}" placeholder="z.B. Erika Muster, 0170 1234567"></div><button class="btn btn-primary btn-block" onclick="saveEmergencyContact()">💾 Speichern</button>`);}
function saveEmergencyContact(){const contact=document.getElementById('emergencyContactInput')?.value;setState({profile:{...state.profile,emergencyContact:contact}});closeModal();showToast('Notfallkontakt gespeichert ✓');}
function surgeonModal(){showModal('👨‍⚕️ Operateur',`<div class="form-group"><label class="form-label">Name des Operateurs</label><input type="text" class="form-input" id="surgeonInput" value="${state.profile.surgeon||''}" placeholder="z.B. Dr. Schmidt"></div><button class="btn btn-primary btn-block" onclick="saveSurgeon()">💾 Speichern</button>`);}
function saveSurgeon(){const surgeon=document.getElementById('surgeonInput')?.value;setState({profile:{...state.profile,surgeon:surgeon}});closeModal();showToast('Operateur gespeichert ✓');}
function toggleLargeFont(){setState({largeFont:!state.largeFont});document.documentElement.style.fontSize=state.largeFont?'18px':'16px';showToast(state.largeFont?'Große Schrift aktiviert':'Normale Schrift');}
function toggleNotifications(){const newValue=state.notifications===false;setState({notifications:newValue});showToast(newValue?'Erinnerungen aktiviert':'Erinnerungen deaktiviert');}
function exportAllData(){const data={profile:state.profile,photos:state.photos.length,voiceMemos:state.voiceMemos.length,transcripts:state.transcripts,painEntries:state.painEntries,vitalEntries:state.vitalEntries,appointments:state.appointments,medications:state.medications,tasks:state.tasks,exportDate:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='operationsbegleiter-daten.json';a.click();URL.revokeObjectURL(url);showToast('Daten exportiert 📤');}
function renderImpressum(){return`<div class="screen"><div class="section-header"><h1 class="section-title">ℹ️ Impressum & Datenschutz</h1></div><div class="info-content" style="margin-bottom:16px;"><h3 style="margin-bottom:12px;color:var(--text);">📱 Über diese App</h3><p style="color:var(--muted);line-height:1.6;margin-bottom:12px;">Der Operationsbegleiter ist eine kostenlose App zur persönlichen Dokumentation rund um Ihre Operation. Die App dient ausschließlich der Organisation und ersetzt keine ärztliche Beratung.</p><h3 style="margin:20px 0 12px;color:var(--text);">⚕️ Medizinischer Hinweis</h3><p style="color:var(--muted);line-height:1.6;margin-bottom:12px;">Diese App bietet keine medizinische Beratung, Diagnose oder Behandlung. Bei gesundheitlichen Beschwerden wenden Sie sich immer an Ihren Arzt, die Klinik oder den ärztlichen Notdienst (116 117) bzw. bei lebensbedrohlichen Notfällen an die 112.</p><h3 style="margin:20px 0 12px;color:var(--text);">🔒 Datenschutz</h3><p style="color:var(--muted);line-height:1.6;margin-bottom:12px;">Alle Ihre Daten (Fotos, Notizen, Sprachaufnahmen, Vitalwerte etc.) werden ausschließlich lokal auf Ihrem Gerät gespeichert. Es findet keine Übertragung an externe Server statt. Sie haben jederzeit die volle Kontrolle über Ihre Daten und können diese in den Einstellungen exportieren oder löschen.</p><h3 style="margin:20px 0 12px;color:var(--text);">📧 Kontakt</h3><p style="color:var(--muted);line-height:1.6;">Bei Fragen oder Anregungen zur App können Sie uns kontaktieren.</p></div><div class="storage-info"><span>💡</span><p>Version 1.0 - Stand Februar 2026</p></div></div>`;}

function attachListeners(){document.querySelectorAll('#disclaimer,#privacy').forEach(el=>{el?.addEventListener('change',e=>{const p={...state.profile};if(e.target.id==='disclaimer')p.disclaimerAccepted=e.target.checked;if(e.target.id==='privacy')p.privacyAccepted=e.target.checked;setState({profile:p});});});document.querySelectorAll('.tab').forEach(t=>{t.addEventListener('click',e=>{const tab=e.target.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.querySelectorAll('.info-section').forEach(s=>s.classList.add('hidden'));document.querySelector(`[data-content="${tab}"]`)?.classList.remove('hidden');});});document.querySelectorAll('.filter-tab').forEach(t=>{t.addEventListener('click',e=>{const f=e.target.dataset.filter;document.querySelectorAll('.filter-tab').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');document.querySelectorAll('.task').forEach(task=>{const done=task.classList.contains('completed');if(f==='all')task.style.display='';else if(f==='open')task.style.display=done?'none':'';else task.style.display=done?'':'none';});});});const chatMsgs=document.getElementById('chatMessages');if(chatMsgs)chatMsgs.scrollTop=chatMsgs.scrollHeight;}

document.addEventListener('DOMContentLoaded',()=>{if(state.largeFont)document.documentElement.style.fontSize='18px';render();});

window.toggleTheme=toggleTheme;window.toggleTask=toggleTask;window.toggleDoc=toggleDoc;window.nav=nav;window.goBack=goBack;window.toggleMenu=toggleMenu;window.nextStep=nextStep;window.prevStep=prevStep;window.noteModal=noteModal;window.saveNote=saveNote;window.addDocModal=addDocModal;window.submitDoc=submitDoc;window.delCustomDoc=delCustomDoc;window.apptModal=apptModal;window.submitAppt=submitAppt;window.delAppt=delAppt;window.medModal=medModal;window.submitMed=submitMed;window.delMed=delMed;window.toggleAlarm=toggleAlarm;window.dateModal=dateModal;window.changeDate=changeDate;window.typeModal=typeModal;window.changeType=changeType;window.resetModal=resetModal;window.resetApp=resetApp;window.closeModal=closeModal;window.handlePhoto=handlePhoto;window.delPhoto=delPhoto;window.viewPhoto=viewPhoto;window.handleDocUpload=handleDocUpload;window.delUploadedDoc=delUploadedDoc;window.startRec=startRec;window.stopRec=stopRec;window.playMemo=playMemo;window.delMemo=delMemo;window.startSpeech=startSpeech;window.stopSpeech=stopSpeech;window.delTranscript=delTranscript;window.savePain=savePain;window.saveVitals=saveVitals;window.saveMedRec=saveMedRec;window.questionModal=questionModal;window.submitQuestion=submitQuestion;window.addQuestion=addQuestion;window.delQuestion=delQuestion;window.sendChatMessage=sendChatMessage;window.renameMemo=renameMemo;window.saveMemoName=saveMemoName;window.editTranscript=editTranscript;window.updateTranscript=updateTranscript;window.saveTranscriptWithName=saveTranscriptWithName;window.exportData=exportData;window.addWoundNote=addWoundNote;window.saveWoundNote=saveWoundNote;window.clinicNameModal=clinicNameModal;window.saveClinicName=saveClinicName;window.clinicPhoneModal=clinicPhoneModal;window.saveClinicPhone=saveClinicPhone;window.emergencyContactModal=emergencyContactModal;window.saveEmergencyContact=saveEmergencyContact;window.surgeonModal=surgeonModal;window.saveSurgeon=saveSurgeon;window.toggleLargeFont=toggleLargeFont;window.toggleNotifications=toggleNotifications;window.exportAllData=exportAllData;window.setLanguage=setLanguage;window.setOpMode=setOpMode;window.showAdFreeModal=showAdFreeModal;window.languageModal=languageModal;window.opModeModal=opModeModal;window.departureModal=departureModal;window.saveDeparture=saveDeparture;window.durationModal=durationModal;window.saveDuration=saveDuration;window.transportAltModal=transportAltModal;window.saveTransportAlt=saveTransportAlt;window.toggleDocCheck=toggleDocCheck;window.setFastingAlarm=setFastingAlarm;window.setWoundAlarm=setWoundAlarm;window.woundAlarmModal=woundAlarmModal;window.fastingAlarmModal=fastingAlarmModal;window.acceptTranslationWarning=acceptTranslationWarning;
</script>
