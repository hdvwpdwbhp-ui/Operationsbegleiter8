<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Operationsbegleiter</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#6366f1;--secondary:#ec4899;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--bg:#f0f4ff;--card:#ffffff;--text:#1e1b4b;--muted:#64748b;--border:rgba(99,102,241,0.15);--input-bg:#ffffff;--gradient:linear-gradient(135deg,#6366f1,#8b5cf6,#ec4899);--radius:16px}
        html[data-theme="dark"]{--bg:#0f0d1a;--card:#1e1b4b;--text:#f1f5f9;--muted:#a5b4fc;--border:rgba(139,92,246,0.3);--input-bg:#2d2a5e}
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{background-color:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;transition:background-color .3s ease,color .3s ease}
        .hidden{display:none!important}
        .app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px;background-color:var(--bg);transition:background-color .3s ease}
        .header{position:sticky;top:0;z-index:100;padding:12px 16px;background-color:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;transition:all .3s ease}
        .back-btn,.icon-btn{width:36px;height:36px;border:none;background-color:var(--bg);border-radius:10px;font-size:1.1rem;cursor:pointer;color:var(--text);transition:all .3s ease}
        .logo-img{width:32px;height:32px;border-radius:8px}
        .logo{flex:1;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.95rem;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .screen{padding:16px;animation:fadeIn .3s;background-color:var(--bg);min-height:calc(100vh - 60px);transition:background-color .3s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
        @keyframes glow{0%,100%{box-shadow:0 0 20px rgba(99,102,241,0.3)}50%{box-shadow:0 0 35px rgba(139,92,246,0.5)}}
        @keyframes recording{0%,100%{opacity:1}50%{opacity:.5}}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .form-group{margin-bottom:16px}
        .form-label{display:block;font-weight:600;margin-bottom:8px;font-size:.9rem;color:var(--text);transition:color .3s ease}
        .form-input,.form-select,.form-textarea{width:100%;padding:14px 16px;border:2px solid var(--border);border-radius:var(--radius);background-color:var(--input-bg);color:var(--text);font-size:1rem;font-family:inherit;transition:all .3s ease}
        .form-input.date-input{max-width:160px}
        .form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary)}
        .form-input::placeholder,.form-textarea::placeholder{color:var(--muted)}
        .form-textarea{resize:vertical;min-height:80px}
        .checkbox-group{display:flex;align-items:flex-start;gap:12px;padding:14px;background-color:var(--card);border-radius:var(--radius);margin-bottom:10px;cursor:pointer;border:1px solid var(--border);transition:all .3s ease}
        .checkbox-group input{display:none}
        .custom-checkbox{width:22px;height:22px;min-width:22px;border:2px solid var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .3s ease}
        .checkbox-group input:checked+.custom-checkbox{background:var(--gradient);border:none}
        .checkbox-group input:checked+.custom-checkbox::after{content:'✓';color:#fff;font-size:.8rem}
        .checkbox-title{font-weight:600;font-size:.9rem;color:var(--text);transition:color .3s ease}
        .checkbox-desc{font-size:.8rem;color:var(--muted);margin-top:2px}
        .btn{padding:14px 24px;border:none;border-radius:25px;font-size:.95rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;font-family:inherit}
        .btn-primary{background:var(--gradient);color:#fff;box-shadow:0 4px 15px rgba(99,102,241,0.4)}
        .btn-primary:hover{transform:translateY(-2px)}
        .btn-secondary{background-color:var(--card);color:var(--text);border:2px solid var(--border);transition:all .3s ease}
        .btn-danger{background-color:var(--danger);color:#fff}
        .btn-block{width:100%}
        .btn-sm{padding:10px 16px;font-size:.85rem}
        .hero{background:var(--gradient);border-radius:var(--radius);padding:24px;margin-bottom:20px;animation:glow 3s ease infinite}
        .hero-label{color:rgba(255,255,255,.8);font-size:.85rem;margin-bottom:6px}
        .hero-value{font-family:'Space Grotesk',sans-serif;font-size:3.5rem;font-weight:700;color:#fff;line-height:1}
        .hero-unit{color:rgba(255,255,255,.9);font-size:1.1rem;margin-top:4px}
        .hero-date{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.9);font-size:.9rem}
        .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .section-title{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:700;color:var(--text);transition:color .3s ease}
        .section-link{color:var(--primary);font-weight:600;font-size:.85rem;cursor:pointer}
        .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
        .grid-card{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;transition:all .3s ease}
        .grid-card:hover{transform:translateY(-3px);box-shadow:0 4px 20px rgba(99,102,241,0.12)}
        .grid-icon{font-size:1.8rem;margin-bottom:6px}
        .grid-label{font-weight:600;font-size:.85rem;color:var(--text);transition:color .3s ease}
        .card{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:12px;transition:all .3s ease}
        .card-item{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);cursor:pointer;transition:all .3s ease}
        .card-item:last-child{border-bottom:none}
        .card-item:hover{background-color:var(--bg)}
        .card-content{flex:1}
        .card-title{font-weight:600;font-size:.9rem;color:var(--text);transition:color .3s ease}
        .card-desc{font-size:.8rem;color:var(--muted)}
        .badge{padding:5px 10px;background:var(--gradient);border-radius:10px;color:#fff;font-weight:700;font-size:.75rem}
        .badge.today{background-color:var(--warning);animation:pulse 1.5s infinite}
        .menu-fab{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:14px 28px;background:var(--gradient);color:#fff;border:none;border-radius:25px;font-size:.95rem;font-weight:600;cursor:pointer;box-shadow:0 4px 25px rgba(99,102,241,0.5);z-index:100;display:flex;align-items:center;gap:8px;font-family:inherit}
        .menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;backdrop-filter:blur(4px)}
        .menu-drawer{position:fixed;bottom:0;left:0;right:0;background-color:var(--card);border-radius:var(--radius) var(--radius) 0 0;max-height:80vh;overflow-y:auto;z-index:1001;animation:slideUp .3s;transition:background-color .3s ease}
        .menu-header{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .menu-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.1rem;color:var(--text);transition:color .3s ease}
        .menu-close{width:32px;height:32px;border:none;background-color:var(--bg);border-radius:50%;font-size:1rem;cursor:pointer;color:var(--text);transition:all .3s ease}
        .menu-section{padding:12px 16px;border-bottom:1px solid var(--border)}
        .menu-section-title{font-size:.7rem;color:var(--muted);text-transform:uppercase;margin-bottom:8px;font-weight:600}
        .menu-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius);cursor:pointer;margin-bottom:4px;transition:all .3s ease}
        .menu-item:hover{background-color:var(--bg)}
        .menu-item-icon{font-size:1.3rem;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background-color:var(--bg);border-radius:10px;transition:all .3s ease}
        .menu-item h4{font-weight:600;font-size:.9rem;color:var(--text);transition:color .3s ease}
        .menu-item p{font-size:.75rem;color:var(--muted)}
        .timeline{position:relative;padding-left:35px}
        .timeline-line{position:absolute;left:14px;top:0;bottom:0;width:3px;background:linear-gradient(var(--primary),var(--secondary))}
        .timeline-phase{margin-bottom:20px}
        .timeline-header{display:flex;align-items:center;margin-bottom:10px;position:relative}
        .timeline-dot{position:absolute;left:-28px;width:20px;height:20px;background-color:var(--card);border:3px solid var(--primary);border-radius:50%;transition:all .3s ease}
        .timeline-dot.today{background-color:var(--warning);border-color:var(--warning);box-shadow:0 0 15px rgba(245,158,11,.5);animation:pulse 1.5s infinite}
        .timeline-dot.completed{background-color:var(--success);border-color:var(--success)}
        .timeline-dot.op{background-color:var(--secondary);border-color:var(--secondary);width:26px;height:26px;left:-31px}
        .phase-label{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1rem;color:var(--text);transition:color .3s ease}
        .phase-date{font-size:.8rem;color:var(--muted)}
        .task{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;transition:all .3s ease}
        .task.completed{opacity:.6}
        .task.completed .task-title{text-decoration:line-through}
        .task-header{display:flex;align-items:flex-start;gap:10px}
        .task-check{width:24px;height:24px;min-width:24px;border:2px solid var(--primary);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;transition:all .3s ease}
        .task-check.checked{background-color:var(--success);border-color:var(--success);color:#fff}
        .task-title{font-weight:600;font-size:.9rem;color:var(--text);transition:color .3s ease}
        .task-desc{font-size:.8rem;color:var(--muted);margin-top:2px}
        .task-note{margin-top:10px;padding:10px;background-color:rgba(99,102,241,.1);border-radius:10px;font-size:.85rem;color:var(--text)}
        .add-note-btn{margin-top:8px;padding:6px 12px;border:none;background:transparent;color:var(--primary);font-weight:600;font-size:.8rem;cursor:pointer}
        .fasting{background:linear-gradient(135deg,rgba(239,68,68,.1),rgba(245,158,11,.1));border:2px solid var(--warning);border-radius:var(--radius);padding:16px;margin-bottom:16px}
        .fasting-title{font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:var(--text)}
        .fasting-rule{display:flex;align-items:center;gap:10px;padding:10px 12px;background-color:var(--card);border-radius:10px;margin-bottom:8px;transition:all .3s ease}
        .fasting-rule:last-child{margin-bottom:0}
        .fasting-icon{font-size:1.3rem}
        .fasting-text strong{display:block;font-size:.9rem;color:var(--text)}
        .fasting-text span{font-size:.8rem;color:var(--muted)}
        .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
        .tab{padding:10px 16px;border:1px solid var(--border);border-radius:20px;background-color:var(--card);color:var(--muted);font-weight:600;font-size:.85rem;white-space:nowrap;cursor:pointer;transition:all .3s ease}
        .tab.active{background:var(--gradient);color:#fff;border:none}
        .info-content{background-color:var(--card);border-radius:var(--radius);padding:20px;border:1px solid var(--border);transition:all .3s ease}
        .info-list{list-style:none}
        .info-list li{padding:8px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px;font-size:.9rem;line-height:1.5;color:var(--text)}
        .info-list li:last-child{border-bottom:none}
        .info-list li::before{content:'•';color:var(--primary);font-weight:bold}
        .disclaimer{background-color:rgba(99,102,241,.1);border-radius:var(--radius);padding:14px;font-size:.85rem;color:var(--muted);display:flex;gap:10px;margin-top:16px}
        .emergency{background:linear-gradient(135deg,var(--danger),#dc2626);border-radius:var(--radius);padding:20px;margin-bottom:16px;color:#fff;text-align:center}
        .emergency-title{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:10px}
        .emergency-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:#fff;color:var(--danger);border-radius:20px;font-weight:700;text-decoration:none;margin-top:10px}
        .warning-card{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px;transition:all .3s ease}
        .warning-card:hover{border-color:var(--warning)}
        .warning-card h4{font-weight:600;font-size:.9rem;color:var(--text)}
        .warning-card p{font-size:.8rem;color:var(--muted)}
        .warning-icon{font-size:1.3rem}
        .clinic-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background-color:var(--card);border:2px solid var(--primary);border-radius:var(--radius);color:var(--primary);font-weight:700;text-decoration:none;margin-top:16px;transition:all .3s ease}
        .upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:20px;text-align:center;cursor:pointer;margin-bottom:12px;transition:all .3s ease}
        .upload-area:hover{border-color:var(--primary);background-color:rgba(99,102,241,.05)}
        .upload-icon{font-size:2rem;margin-bottom:6px}
        .upload-text{color:var(--muted);font-size:.85rem}
        .file-input{display:none}
        .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
        .photo-item{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;cursor:pointer}
        .photo-item img{width:100%;height:100%;object-fit:cover}
        .photo-date{position:absolute;bottom:0;left:0;right:0;padding:3px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:.6rem;text-align:center}
        .photo-delete{position:absolute;top:3px;right:3px;width:20px;height:20px;background:rgba(239,68,68,.9);border:none;border-radius:50%;color:#fff;font-size:.7rem;cursor:pointer;opacity:0;transition:opacity .2s}
        .photo-item:hover .photo-delete{opacity:1}
        .doc-file{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;transition:all .3s ease}
        .doc-file-icon{font-size:1.5rem}
        .doc-file-info{flex:1}
        .doc-file-name{font-weight:600;font-size:.85rem;color:var(--text)}
        .doc-file-meta{font-size:.75rem;color:var(--muted)}
        .doc-file-del{border:none;background:transparent;color:var(--danger);cursor:pointer;padding:4px}
        .recording-controls{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;background-color:var(--card);border-radius:var(--radius);border:1px solid var(--border);transition:all .3s ease}
        .record-btn{width:70px;height:70px;border-radius:50%;border:none;background:var(--gradient);color:#fff;font-size:1.8rem;cursor:pointer;box-shadow:0 4px 20px rgba(99,102,241,.4)}
        .record-btn.recording{background-color:var(--danger);animation:recording 1s infinite}
        .recording-status{font-weight:600;color:var(--muted)}
        .recording-status.active{color:var(--danger)}
        .recording-timer{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:700;color:var(--text)}
        .speech-btn{width:100%;padding:16px;border:2px dashed var(--primary);border-radius:var(--radius);background-color:rgba(99,102,241,.05);color:var(--primary);font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-family:inherit;transition:all .3s ease}
        .speech-btn.listening{background-color:rgba(239,68,68,.1);border-color:var(--danger);color:var(--danger);animation:recording 1s infinite}
        .memo-item{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;display:flex;align-items:center;gap:10px;margin-top:10px;transition:all .3s ease}
        .play-btn{width:36px;height:36px;min-width:36px;border-radius:50%;border:none;background:var(--gradient);color:#fff;cursor:pointer}
        .memo-info{flex:1}
        .memo-title{font-weight:600;font-size:.85rem;color:var(--text)}
        .memo-meta{font-size:.75rem;color:var(--muted)}
        .memo-delete{border:none;background:transparent;color:var(--danger);cursor:pointer;padding:4px}
        .transcript-item{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:10px;transition:all .3s ease}
        .transcript-header{display:flex;justify-content:space-between;margin-bottom:8px}
        .transcript-date{font-size:.8rem;color:var(--muted)}
        .transcript-delete{border:none;background:transparent;color:var(--danger);cursor:pointer}
        .transcript-text{color:var(--text)}
        .vas-container{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;transition:all .3s ease}
        .vas-title{font-weight:600;color:var(--text);margin-bottom:6px}
        .vas-scale{display:flex;align-items:center;gap:10px;margin:14px 0}
        .vas-label{font-size:.75rem;color:var(--muted);min-width:50px}
        .vas-slider{flex:1;-webkit-appearance:none;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--success),var(--warning),var(--danger))}
        .vas-slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--primary);cursor:pointer}
        .vas-value{min-width:35px;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700;color:var(--text)}
        .vas-emojis{display:flex;justify-content:space-between;font-size:1.2rem}
        .chart-container{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px;transition:all .3s ease}
        .chart-title{font-weight:700;margin-bottom:12px;color:var(--text)}
        .chart-canvas{width:100%;height:150px}
        .chart-svg{width:100%;height:100%}
        .chart-no-data{display:flex;flex-direction:column;align-items:center;justify-content:center;height:120px;color:var(--muted)}
        .chart-no-data-icon{font-size:1.8rem;margin-bottom:6px}
        .vitals-row{display:flex;gap:10px;margin-bottom:10px}
        .vitals-group{flex:1}
        .vitals-group label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
        .vitals-group input{width:100%;padding:10px;border:2px solid var(--border);border-radius:10px;background-color:var(--input-bg);color:var(--text);font-size:1rem;text-align:center;transition:all .3s ease}
        .vitals-group input:focus{outline:none;border-color:var(--primary)}
        .appt-card{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;gap:12px;transition:all .3s ease}
        .appt-date{min-width:50px;text-align:center;padding:8px;background:var(--gradient);border-radius:10px;color:#fff}
        .appt-day{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;font-weight:700;line-height:1}
        .appt-month{font-size:.7rem}
        .appt-info{flex:1}
        .appt-title{font-weight:600;font-size:.9rem;color:var(--text)}
        .appt-details{font-size:.8rem;color:var(--muted)}
        .appt-delete{border:none;background:transparent;color:var(--danger);cursor:pointer;padding:4px}
        .med-card{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;transition:all .3s ease}
        .med-header{display:flex;justify-content:space-between;margin-bottom:10px}
        .med-name{font-weight:600;color:var(--text)}
        .med-dose{font-size:.85rem;color:var(--muted)}
        .med-times{display:flex;flex-wrap:wrap;gap:6px}
        .med-time{display:flex;align-items:center;gap:4px;padding:5px 10px;background-color:rgba(99,102,241,.1);border-radius:15px;font-size:.8rem;cursor:pointer;color:var(--text)}
        .alarm-dot{width:6px;height:6px;background-color:var(--success);border-radius:50%}
        .alarm-dot.off{background-color:var(--muted)}
        .doc-item{padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);cursor:pointer;transition:all .3s ease}
        .doc-item:last-child{border-bottom:none}
        .doc-item:hover{background-color:var(--bg)}
        .doc-check{width:22px;height:22px;min-width:22px;border:2px solid var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .3s ease}
        .doc-item.checked .doc-check{background-color:var(--success);border-color:var(--success);color:#fff}
        .doc-icon{font-size:1.1rem}
        .doc-label{flex:1;font-weight:500;font-size:.9rem;color:var(--text)}
        .doc-delete{border:none;background:transparent;color:var(--danger);cursor:pointer;opacity:0;padding:4px;transition:opacity .2s}
        .doc-item:hover .doc-delete{opacity:1}
        .settings-card{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;transition:all .3s ease}
        .settings-item{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
        .settings-item:last-child{border-bottom:none}
        .settings-label{display:flex;align-items:center;gap:12px}
        .settings-icon{font-size:1.2rem}
        .settings-text h4{font-weight:600;font-size:.9rem;color:var(--text)}
        .settings-text p{font-size:.8rem;color:var(--muted)}
        .toggle{position:relative;width:50px;height:26px}
        .toggle input{opacity:0;width:0;height:0}
        .toggle-slider{position:absolute;cursor:pointer;inset:0;background-color:var(--border);border-radius:13px;transition:.3s}
        .toggle-slider::before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
        .toggle input:checked+.toggle-slider{background:var(--gradient)}
        .toggle input:checked+.toggle-slider::before{transform:translateX(24px)}
        .storage-info{background-color:rgba(99,102,241,.1);border-radius:var(--radius);padding:14px;font-size:.85rem;color:var(--muted);display:flex;gap:10px}
        .question-card{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;transition:all .3s ease}
        .question-header{padding:16px;display:flex;align-items:center;gap:12px}
        .question-header.anaesthesist{background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.1));border-bottom:2px solid var(--primary)}
        .question-header.operateur{background:linear-gradient(135deg,rgba(16,185,129,.15),rgba(52,211,153,.1));border-bottom:2px solid var(--success)}
        .question-icon{font-size:2.5rem}
        .question-header-info h3{font-weight:700;font-size:1.1rem;color:var(--text)}
        .question-header-info p{font-size:.8rem;color:var(--muted);margin-top:2px}
        .question-timing{margin:12px 16px;padding:8px 14px;border-radius:20px;font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:6px}
        .question-timing.vor-op{background-color:rgba(245,158,11,.15);color:var(--warning)}
        .question-timing.op-tag{background-color:rgba(239,68,68,.15);color:var(--danger)}
        .question-timing.nach-op{background-color:rgba(16,185,129,.15);color:var(--success)}
        .question-body{padding:0 16px 16px}
        .question-item{display:flex;align-items:flex-start;gap:10px;padding:12px;background-color:var(--bg);border-radius:10px;margin-bottom:8px;transition:all .3s ease}
        .question-bullet{color:var(--primary);font-weight:bold}
        .question-text{flex:1;color:var(--text);font-size:.9rem;line-height:1.4}
        .question-del{border:none;background:transparent;color:var(--danger);cursor:pointer;padding:2px}
        .question-empty{padding:16px;text-align:center;color:var(--muted);font-size:.85rem}
        .chat-container{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .3s ease}
        .chat-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(236,72,153,.1))}
        .chat-header-icon{font-size:1.5rem}
        .chat-header-text h3{font-weight:700;font-size:1rem;color:var(--text)}
        .chat-header-text p{font-size:.75rem;color:var(--muted)}
        .chat-messages{height:280px;overflow-y:auto;padding:16px;background-color:var(--bg);transition:background-color .3s ease}
        .chat-message{margin-bottom:12px;max-width:85%}
        .chat-message.user{margin-left:auto}
        .chat-message.assistant{margin-right:auto}
        .chat-bubble{padding:12px 16px;border-radius:var(--radius);font-size:.9rem;line-height:1.5}
        .chat-message.user .chat-bubble{background:var(--gradient);color:#fff;border-bottom-right-radius:4px}
        .chat-message.assistant .chat-bubble{background-color:var(--card);color:var(--text);border-bottom-left-radius:4px;border:1px solid var(--border)}
        .chat-input-area{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background-color:var(--card);transition:background-color .3s ease}
        .chat-input{flex:1;padding:12px;border:2px solid var(--border);border-radius:20px;background-color:var(--input-bg);color:var(--text);font-family:inherit;font-size:.9rem;transition:all .3s ease}
        .chat-input:focus{outline:none;border-color:var(--primary)}
        .chat-send{width:44px;height:44px;border:none;background:var(--gradient);color:#fff;border-radius:50%;cursor:pointer;font-size:1.1rem}
        .chat-disclaimer{padding:10px;background-color:rgba(245,158,11,.1);font-size:.7rem;color:var(--muted);text-align:center}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:2000;backdrop-filter:blur(4px)}
        .modal{background-color:var(--card);border-radius:var(--radius) var(--radius) 0 0;padding:20px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;animation:slideUp .3s;transition:background-color .3s ease}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .modal-title{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:700;color:var(--text)}
        .modal-close{width:32px;height:32px;border:none;background-color:var(--bg);border-radius:50%;font-size:1rem;cursor:pointer;color:var(--text);transition:all .3s ease}
        .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background-color:var(--text);color:var(--bg);padding:12px 20px;border-radius:20px;font-weight:600;font-size:.9rem;z-index:3000;animation:fadeIn .3s,fadeOut .3s 2.7s forwards}
        @keyframes fadeOut{to{opacity:0;transform:translate(-50%,10px)}}
        .photo-viewer{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:3000;display:flex;flex-direction:column}
        .photo-viewer-header{padding:14px;display:flex;justify-content:space-between;align-items:center;color:#fff}
        .photo-viewer-close{width:40px;height:40px;border:none;background:rgba(255,255,255,.1);color:#fff;border-radius:50%;font-size:1.3rem;cursor:pointer}
        .photo-viewer-content{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
        .photo-viewer-content img{max-width:100%;max-height:100%;object-fit:contain}
        .onboarding{min-height:100vh;display:flex;flex-direction:column;background-color:var(--bg);transition:background-color .3s ease}
        .onboarding-progress{padding:16px;display:flex;gap:6px}
        .progress-dot{flex:1;height:4px;border-radius:2px;background-color:var(--border)}
        .progress-dot.active{background:var(--gradient)}
        .progress-dot.completed{background-color:var(--success)}
        .onboarding-content{flex:1;padding:16px 20px;display:flex;flex-direction:column}
        .onboarding-hero{text-align:center;margin-bottom:28px}
        .onboarding-logo{width:80px;height:80px;margin:0 auto 16px;border-radius:20px}
        .onboarding-title{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;margin-bottom:10px;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .onboarding-subtitle{font-size:.95rem;color:var(--muted);line-height:1.5}
        .onboarding-nav{padding:16px 20px;display:flex;gap:10px}
        .progress-container{margin-bottom:14px}
        .progress-label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:.85rem;color:var(--text)}
        .progress-bar{height:10px;background-color:var(--border);border-radius:5px;overflow:hidden}
        .progress-fill{height:100%;background:var(--gradient);border-radius:5px;transition:width .5s}
        .filter-tabs{display:flex;gap:6px;flex-wrap:wrap}
        .filter-tab{padding:8px 14px;border:none;border-radius:15px;background:transparent;color:var(--muted);font-weight:600;font-size:.85rem;cursor:pointer;transition:all .3s ease}
        .filter-tab.active{background:var(--gradient);color:#fff}
        @media print{.header,.menu-fab,.modal-overlay{display:none!important}.app{max-width:100%;padding:16px}}
        /* Mobile-specific fixes */
        @media (max-width:480px){
            .hero-value{font-size:2.8rem}
            .grid{grid-template-columns:repeat(3,1fr);gap:8px}
            .grid-card{padding:12px 8px}
            .grid-icon{font-size:1.5rem;margin-bottom:4px}
            .grid-label{font-size:.75rem}
            .btn{padding:12px 20px;font-size:.9rem;min-height:48px}
            .btn-sm{padding:10px 14px;min-height:44px}
            .speech-btn{padding:18px 16px;font-size:1rem;min-height:56px}
            .record-btn{width:80px;height:80px;font-size:2rem}
            .form-input,.form-textarea,.form-select{padding:16px;font-size:16px;min-height:52px}
            .modal{max-height:90vh;padding:16px}
            .menu-fab{padding:12px 24px;font-size:.9rem;bottom:16px}
            .card-item{padding:16px;min-height:60px}
            .task-check{width:28px;height:28px;min-width:28px}
            .vas-slider::-webkit-slider-thumb{width:32px;height:32px}
            .photo-item{aspect-ratio:1}
            .play-btn{width:44px;height:44px;min-width:44px}
            .memo-item{padding:14px}
            .transcript-item{padding:16px}
            .upload-area{padding:24px 16px}
            .screen{padding:12px}
            .header{padding:10px 12px}
            .section-title{font-size:1rem}
        }
        @media (max-width:360px){
            .grid{grid-template-columns:repeat(2,1fr)}
            .hero-value{font-size:2.2rem}
            .hero{padding:18px}
        }
        /* Touch feedback */
        .btn:active,.grid-card:active,.card-item:active,.menu-item:active{transform:scale(0.97);opacity:0.9}
        .speech-btn:active{transform:scale(0.98)}
        /* Safe area for notched phones */
        .app{padding-bottom:max(90px,env(safe-area-inset-bottom,90px))}
        .menu-fab{bottom:max(20px,env(safe-area-inset-bottom,20px))}
        .menu-drawer{padding-bottom:env(safe-area-inset-bottom,0)}
        /* Prevent zoom on input focus iOS */
        input[type="text"],input[type="date"],input[type="datetime-local"],input[type="tel"],input[type="number"],textarea,select{font-size:16px!important}
        .wound-timeline{display:flex;flex-direction:column;gap:16px}
        .wound-day{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .3s ease}
        .wound-day-header{padding:14px;background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(236,72,153,.1));border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
        .wound-day-badge{background:var(--gradient);color:#fff;padding:6px 12px;border-radius:20px;font-weight:700;font-size:.85rem}
        .wound-day-date{color:var(--muted);font-size:.85rem}
        .wound-day-content{padding:14px}
        .wound-day-photos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
        .wound-day-photo{width:80px;height:80px;border-radius:10px;overflow:hidden;cursor:pointer}
        .wound-day-photo img{width:100%;height:100%;object-fit:cover}
        .wound-day-note{padding:10px;background-color:var(--bg);border-radius:10px;font-size:.85rem;color:var(--text)}
        .doctor-mode-card{background-color:var(--card);border:2px solid var(--primary);border-radius:var(--radius);padding:16px;margin-bottom:12px}
        .doctor-mode-section{margin-bottom:16px}
        .doctor-mode-title{font-weight:700;font-size:.9rem;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:6px}
        .doctor-mode-value{font-size:.95rem;color:var(--text)}
        .doctor-mode-list{list-style:none;padding-left:0}
        .doctor-mode-list li{padding:6px 0;border-bottom:1px solid var(--border);font-size:.9rem}
        .doctor-mode-list li:last-child{border-bottom:none}
        .export-card{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;cursor:pointer;transition:all .3s ease}
        .export-card:hover{border-color:var(--primary);transform:translateY(-2px)}
        .export-icon{font-size:2rem;margin-bottom:8px}
        .export-title{font-weight:600;color:var(--text)}
        .export-desc{font-size:.8rem;color:var(--muted)}
        .transcript-name{font-weight:600;font-size:.9rem;color:var(--primary);margin-bottom:4px}
        .transcript-edit{background:none;border:none;color:var(--primary);cursor:pointer;padding:4px;font-size:.85rem}
        /* Speech status indicator */
        .speech-status{display:flex;align-items:center;gap:8px;padding:12px;background:rgba(239,68,68,.1);border-radius:10px;margin-top:10px}
        .speech-pulse{width:12px;height:12px;background:var(--danger);border-radius:50%;animation:recording 1s infinite}
        /* HTTPS warning */
        .https-warning{background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(239,68,68,.1));border:2px solid var(--warning);border-radius:var(--radius);padding:14px;margin-bottom:16px;text-align:center}
        .https-warning-icon{font-size:2rem;margin-bottom:8px}
        .https-warning-text{font-size:.9rem;color:var(--text);line-height:1.4}
        .language-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:200px;overflow-y:auto;padding:4px}
        .language-option{display:flex;align-items:center;gap:8px;padding:10px 12px;background-color:var(--card);border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .2s}
        .language-option:hover{border-color:var(--primary)}
        .language-option.active{border-color:var(--primary);background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(139,92,246,.1))}
        .lang-flag{font-size:1.3rem}
        .lang-name{font-size:.85rem;font-weight:600;color:var(--text)}
        .op-mode-toggle{display:flex;gap:10px}
        .op-mode-btn{flex:1;padding:14px;border:2px solid var(--border);border-radius:var(--radius);background-color:var(--card);color:var(--text);font-weight:600;cursor:pointer;transition:all .2s}
        .op-mode-btn.active{border-color:var(--primary);background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(139,92,246,.1));color:var(--primary)}
        .clinic-call-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:var(--radius);color:#fff;font-weight:700;font-size:1rem;text-decoration:none;margin-bottom:16px;cursor:pointer;transition:all .3s ease;box-shadow:0 4px 15px rgba(16,185,129,0.3)}
        .clinic-call-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(16,185,129,0.4)}
        .custom-day-input{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
        .custom-day-input input{flex:1;padding:10px;border:2px solid var(--border);border-radius:10px;background-color:var(--input-bg);color:var(--text);font-size:.9rem}
        .custom-day-input button{padding:10px 16px;background:var(--gradient);color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer}
        .ai-fab{position:fixed;bottom:90px;right:16px;width:50px;height:50px;background:var(--gradient);border:none;border-radius:50%;font-size:1.5rem;cursor:pointer;box-shadow:0 4px 15px rgba(99,102,241,0.4);z-index:99;display:flex;align-items:center;justify-content:center;animation:pulse 2s infinite}
        .warning-card{background-color:var(--card);border:2px solid var(--danger);border-radius:var(--radius);padding:14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px;transition:all .3s ease}
        .warning-card:hover{background-color:rgba(239,68,68,0.05)}
        .warning-icon{font-size:1.5rem;color:var(--danger);min-width:30px;text-align:center}
        .doc-checklist{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px}
        .doc-checklist-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
        .doc-checklist-item:last-child{border-bottom:none}
        .doc-checklist-check{width:22px;height:22px;min-width:22px;border:2px solid var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
        .doc-checklist-check.checked{background:var(--gradient);border:none;color:#fff}
        .hygiene-tips{background-color:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
        .hygiene-step{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:.9rem;color:var(--text)}
        .hygiene-step-num{width:24px;height:24px;min-width:24px;background:var(--gradient);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.75rem;font-weight:700}
        .shower-tips{background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(99,102,241,.1));border:2px solid var(--success);border-radius:var(--radius);padding:16px;margin-bottom:16px}
        .not-needed-ambulant{opacity:.5;text-decoration:line-through}
    </style>
</head>

function escapeHtml(str){if(!str)return'';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}

function formatShort(d){if(!d)return'';return new Date(d).toLocaleDateString(getLocale(),{day:'2-digit',month:'2-digit',year:'2-digit'});}
function formatDT(d){if(!d)return'';return new Date(d).toLocaleDateString(getLocale(),{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function formatTime(s){const m=Math.floor(s/60),sec=s%60;return`${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;}
function getDaysUntil(){if(!state.profile.opDate)return null;const t=new Date();t.setHours(0,0,0,0);const o=new Date(state.profile.opDate);o.setHours(0,0,0,0);return Math.ceil((o-t)/(1000*60*60*24));}

function handlePhoto(e,cat){const files=e.target.files;if(!files.length)return;Array.from(files).forEach(f=>{if(!f.type.startsWith('image/'))return showToast('Nur Bilder');const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const max=800;let w=img.width,h=img.height;if(w>h&&w>max){h=(h*max)/w;w=max;}else if(h>max){w=(w*max)/h;h=max;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);setState({photos:[...state.photos,{id:id(),data:c.toDataURL('image/jpeg',0.7),category:cat,date:new Date().toISOString()}]});showToast('Foto gespeichert 📷');};img.src=ev.target.result;};r.readAsDataURL(f);});e.target.value='';}

async function startRec(){try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const mimeType=MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'audio/ogg';mediaRecorder=new MediaRecorder(stream,{mimeType});audioChunks=[];mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};mediaRecorder.onstop=()=>{if(audioChunks.length===0){showToast('Keine Audiodaten');stream.getTracks().forEach(t=>t.stop());return;}const blob=new Blob(audioChunks,{type:mimeType});const r=new FileReader();r.onload=e=>{const memoName=`Memo ${state.voiceMemos.length+1}`;setState({voiceMemos:[...state.voiceMemos,{id:id(),data:e.target.result,date:new Date().toISOString(),duration:recordingSeconds,title:memoName}]});showToast('Sprachmemo gespeichert 🎤');};r.onerror=()=>showToast('Fehler beim Speichern');r.readAsDataURL(blob);stream.getTracks().forEach(t=>t.stop());};mediaRecorder.start(100);recordingSeconds=0;recordingTimer=setInterval(()=>{recordingSeconds++;const el=document.getElementById('recTimer');if(el)el.textContent=formatTime(recordingSeconds);},1000);render();}catch(e){console.error('Mic error:',e);showToast('Mikrofon nicht verfügbar: '+e.message);}}
function stopRec(){if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();clearInterval(recordingTimer);mediaRecorder=null;render();}}

async function startSpeech(){
    // Check for HTTPS requirement on mobile
    if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1'){
        return showToast('Sprache zu Text benötigt HTTPS');
    }
    // Check browser support
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){
        return showToast('Sprache zu Text nicht verfügbar in diesem Browser. Bitte Chrome oder Safari verwenden.');
    }
    // Request microphone permission first
    try{
        await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(e){
        console.error('Mic permission error:',e);
        return showToast('Mikrofon-Zugriff verweigert. Bitte in den Browser-Einstellungen erlauben.');
    }
    try{
        recognition=new SR();
        recognition.continuous=true;
        recognition.interimResults=true;
        recognition.lang='de-DE';
        recognition.maxAlternatives=1;
        window.speechFinalText='';
        window.speechInterimText='';
        recognition.onstart=()=>{
            console.log('Speech recognition started');
            const el=document.getElementById('liveText');
            if(el)el.textContent='🎤 Aufnahme aktiv - Sprechen Sie jetzt...';
        };
        recognition.onresult=e=>{
            window.speechInterimText='';
            for(let i=e.resultIndex;i<e.results.length;i++){
                if(e.results[i].isFinal){
                    window.speechFinalText+=e.results[i][0].transcript+' ';
                }else{
                    window.speechInterimText+=e.results[i][0].transcript;
                }
            }
            const el=document.getElementById('liveText');
            if(el){
                const finalHtml=window.speechFinalText?`<span style="color:var(--text)">${escapeHtml(window.speechFinalText)}</span>`:'';
                const interimHtml=window.speechInterimText?`<span style="color:var(--muted);font-style:italic">${escapeHtml(window.speechInterimText)}</span>`:'';
                const combinedHtml=finalHtml+interimHtml;
                el.innerHTML=combinedHtml||'🎤 Sprechen Sie jetzt...';
            }
        };
        recognition.onend=()=>{
            console.log('Speech recognition ended');
            const finalText=window.speechFinalText.trim();
            if(finalText){
                showSaveTranscriptModal(finalText);
            }else{
                showToast('Kein Text erkannt. Bitte näher ans Mikrofon sprechen.');
            }
            recognition=null;
            render();
        };
        recognition.onerror=e=>{
            console.error('Speech error:',e.error,e.message);
            let msg='Fehler bei Spracherkennung';
            if(e.error==='not-allowed')msg='Mikrofon-Zugriff verweigert. Bitte in den Browser-Einstellungen erlauben.';
            else if(e.error==='no-speech')msg='Keine Sprache erkannt. Bitte lauter und deutlicher sprechen.';
            else if(e.error==='network')msg='Netzwerkfehler. Bitte Internetverbindung prüfen.';
            else if(e.error==='aborted')msg='Aufnahme abgebrochen';
            else if(e.error==='audio-capture')msg='Kein Mikrofon gefunden';
            else if(e.error==='service-not-allowed')msg='Spracherkennung in diesem Browser nicht erlaubt';
            showToast(msg);
            recognition=null;
            render();
        };
        recognition.onaudiostart=()=>console.log('Audio capture started');
        recognition.onsoundstart=()=>console.log('Sound detected');
        recognition.onspeechstart=()=>console.log('Speech started');
        recognition.start();
        render();
        showToast('🎤 Aufnahme gestartet - Sprechen Sie jetzt!');
    }catch(e){
        console.error('Speech init error:',e);
        showToast('Fehler beim Starten der Spracherkennung. Bitte Browser neu starten.');
        recognition=null;
        render();
    }
}

function getWoundDiaryData(){const wound=state.photos.filter(p=>p.category==='wound').sort((a,b)=>new Date(a.date)-new Date(b.date));if(wound.length===0)return[];const opDate=state.profile.opDate?new Date(state.profile.opDate):null;const grouped={};wound.forEach(p=>{const pDate=new Date(p.date);pDate.setHours(0,0,0,0);let dayKey;if(opDate){const op=new Date(opDate);op.setHours(0,0,0,0);const diffDays=Math.round((pDate-op)/(1000*60*60*24));dayKey=diffDays>=0?`Tag ${diffDays}`:`Tag ${diffDays}`;if(diffDays===0)dayKey='OP-Tag';else if(diffDays>0)dayKey=`Tag ${diffDays} nach OP`;else dayKey=`${Math.abs(diffDays)} Tag(e) vor OP`;}else{dayKey=pDate.toLocaleDateString(getLocale(),{day:'numeric',month:'long',year:'numeric'});}if(!grouped[dayKey])grouped[dayKey]={date:pDate,photos:[],notes:[]};grouped[dayKey].photos.push(p);});const tasks=state.tasks.filter(t=>t.note);tasks.forEach(t=>{const tDate=getDateFor(t.day);if(!tDate)return;const tDateNorm=new Date(tDate);tDateNorm.setHours(0,0,0,0);let dayKey;if(opDate){const op=new Date(opDate);op.setHours(0,0,0,0);const diffDays=Math.round((tDateNorm-op)/(1000*60*60*24));if(diffDays===0)dayKey='OP-Tag';else if(diffDays>0)dayKey=`Tag ${diffDays} nach OP`;else dayKey=`${Math.abs(diffDays)} Tag(e) vor OP`;}else{dayKey=tDateNorm.toLocaleDateString(getLocale(),{day:'numeric',month:'long',year:'numeric'});}if(grouped[dayKey])grouped[dayKey].notes.push({title:t.title,note:t.note});});return Object.entries(grouped).map(([k,v])=>({label:k,date:v.date,photos:v.photos,notes:v.notes})).sort((a,b)=>a.date-b.date);}
